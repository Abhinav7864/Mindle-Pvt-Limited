<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Left Pillar Gradient: Navy to Dark Blue -->
    <linearGradient id="leftPillarGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#020B24" />
      <stop offset="100%" stop-color="#041B4E" />
    </linearGradient>

    <!-- Right Pillar Gradient: Bright Blue to Cyan -->
    <linearGradient id="rightPillarGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Left Diagonal Ribbon: Starts at left pillar center, goes to V-bottom -->
    <linearGradient id="leftDiagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041B4E" />
      <stop offset="100%" stop-color="#0A3E9C" />
    </linearGradient>

    <!-- Right Diagonal Ribbon: Starts at V-bottom, goes to right pillar center -->
    <linearGradient id="rightDiagGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Shadow for the fold overlay -->
    <filter id="foldShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-1.2" dy="1.2" stdDeviation="1" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Left Pillar (Vertical stem) -->
  <rect x="15" y="20" width="14" height="60" rx="7" fill="url(#leftPillarGrad)" />

  <!-- Left Diagonal Ribbon -->
  <path d="M 22,35 L 50,68" stroke="url(#leftDiagGrad)" stroke-width="14" stroke-linecap="round" />

  <!-- Right Diagonal Ribbon (overlapping with shadow) -->
  <path d="M 50,68 L 78,35" stroke="url(#rightDiagGrad)" stroke-width="14" stroke-linecap="round" filter="url(#foldShadow)" />

  <!-- Right Pillar (Vertical stem) -->
  <rect x="71" y="20" width="14" height="60" rx="7" fill="url(#rightPillarGrad)" />
</svg>
